<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>AURA JAMB EXAM</title>
<style>
:root{--navy:#10233f;--navy2:#172d4d;--gold:#f4c95d;--bg:#f3f6fb;--ink:#15243a;--muted:#65748a;--line:#dce4ee;--white:#fff;--green:#16845b;--red:#b42335}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.top{background:var(--navy);color:white;padding:16px max(16px,calc((100vw - 1080px)/2));display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.3px}.mark{width:43px;height:43px;border-radius:13px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:26px;font-weight:1000}.brand small{display:block;font-size:11px;letter-spacing:1.7px;color:#cbd6e6}.top-right{display:flex;gap:8px;align-items:center}.wrap{max-width:1080px;margin:auto;padding:20px 15px 90px}.hero{background:linear-gradient(130deg,var(--navy),#244d79);color:white;border-radius:23px;padding:25px;margin-bottom:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px);line-height:1.15}.hero p{margin:0;color:#d8e5f4}.hero .badge{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:1px}.hero-mark{font-size:75px;color:var(--gold);font-weight:1000;line-height:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:25px 0 12px}.section-head h2{margin:0;font-size:21px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.subject{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;text-align:left;min-height:130px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}.subject:hover{border-color:#b38b17;transform:translateY(-1px)}.subject .emoji{font-size:26px}.subject b{font-size:16px}.subject small{color:var(--muted)}.btn{border:0;border-radius:11px;background:var(--navy);color:white;font-weight:750;padding:11px 15px}.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#eaf0f7;color:var(--navy)}.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.sm{padding:7px 10px;font-size:13px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tabs button{white-space:nowrap}.field{display:grid;gap:5px;margin:12px 0}.field label{font-weight:750;font-size:13px}.field input,.field select,.field textarea,input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd6e3;border-radius:10px;background:white;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}.notice{background:#fff8df;border:1px solid #f1d986;padding:12px;border-radius:12px;color:#664d00;font-size:13px}.hidden{display:none!important}.question{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}.qtop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.qtext{font-size:19px;font-weight:750;margin:17px 0}.option{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:9px 0;cursor:pointer}.option input{width:auto;margin-top:5px}.option.selected{border-color:#286bb5;background:#edf5ff}.option.correct{border-color:var(--green);background:#e7f8f0}.option.wrong{border-color:var(--red);background:#fff0f1}.explain{margin-top:13px;padding:13px;background:#f0f7ff;border-radius:12px}.progress{height:8px;background:#e3eaf2;border-radius:8px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--gold);width:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:14px}th{background:#eef3f9}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px;z-index:5}.bottomnav button{flex:1;max-width:180px;background:white;color:var(--muted);border:0;border-radius:10px;padding:8px 5px;font-size:12px;font-weight:700}.bottomnav button.active{background:#edf2f8;color:var(--navy)}.pill{display:inline-block;padding:4px 9px;background:#edf2f8;border-radius:99px;font-size:12px;font-weight:750}.modal{position:fixed;inset:0;background:#071426b8;display:grid;place-items:center;padding:15px;z-index:20}.modalbox{background:white;border-radius:20px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto}.modalbox h2{margin-top:0}.footnote{font-size:12px;color:var(--muted);margin-top:18px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.hero-mark{display:none}.hero{padding:21px}.wrap{padding-top:14px}.top{padding:12px 14px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.top-right .desktop{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">A</div><div>AURA JAMB EXAM<small>PREPARE • PRACTISE • PROGRESS</small></div></div><div class="top-right"><span id="userLabel" class="desktop"></span><button class="btn gold sm" id="profileBtn">Profile</button></div></header>
<main class="wrap" id="app"></main>
<nav class="bottomnav" id="nav"><button data-page="home" class="active">⌂ Home</button><button data-page="practice">▤ Practice</button><button data-page="results">◷ Results</button><button data-page="leaderboard">★ Leaderboard</button><button data-page="admin">⚙ Admin</button></nav>
<div id="modalRoot"></div>
<script>
const SUBJECTS=[
{name:"Use of English",icon:"📘",questions:[
["Choose the word nearest in meaning to “diligent”.",["Careless","Hardworking","Impatient","Proud"],1,"Diligent means careful and hardworking."],
["Choose the correctly spelt word.",["Accomodation","Acommodation","Accommodation","Acomodation"],2,"Accommodation has double c and double m."],
["Neither the teacher nor the students ___ present.",["was","were","is","has"],1,"With neither…nor, the verb commonly agrees with the nearer subject; students is plural."],
["The expression “once in a blue moon” means",["very often","at the right time","very rarely","every evening"],2,"The idiom means something that happens very rarely."]
]},
{name:"Mathematics",icon:"➗",questions:[
["Solve: 3x − 7 = 11.",["4","5","6","7"],2,"3x = 18, so x = 6."],
["Find 15% of ₦2,400.",["₦240","₦300","₦360","₦400"],2,"0.15 × 2,400 = 360."],
["If a triangle has angles 45° and 65°, its third angle is",["60°","70°","80°","90°"],1,"Angles in a triangle sum to 180°; 180 − 45 − 65 = 70°."],
["Simplify 2³ × 2².",["2⁵","4⁵","2⁶","4³"],0,"For powers with the same base, add exponents: 3 + 2 = 5."]
]},
{name:"Physics",icon:"⚡",questions:[
["The SI unit of force is the",["Joule","Watt","Newton","Pascal"],2,"Force is measured in newtons (N)."],
["A car travels 150 m in 10 s. Its average speed is",["10 m/s","15 m/s","20 m/s","25 m/s"],1,"Speed = distance/time = 150/10 = 15 m/s."],
["Which device converts electrical energy mainly to mechanical energy?",["Electric motor","Generator","Transformer","Accumulator"],0,"An electric motor converts electrical energy to mechanical energy."],
["The image formed by a plane mirror is",["real and inverted","virtual and upright","real and upright","virtual and inverted"],1,"A plane mirror forms a virtual, upright image of the same size."]
]},
{name:"Chemistry",icon:"🧪",questions:[
["The atomic number of an element equals the number of",["neutrons","protons","nucleons","shells"],1,"Atomic number is the number of protons in the nucleus."],
["A solution with pH 2 is",["acidic","neutral","alkaline","a salt only"],0,"A pH below 7 indicates acidity."],
["Which gas relights a glowing splint?",["Hydrogen","Oxygen","Carbon dioxide","Ammonia"],1,"Oxygen supports combustion and relights a glowing splint."],
["The bond formed by transfer of electrons is",["covalent","metallic","ionic","hydrogen"],2,"Ionic bonding involves electron transfer and electrostatic attraction between ions."]
]},
{name:"Biology",icon:"🧬",questions:[
["The basic structural and functional unit of life is the",["organ","cell","tissue","nucleus"],1,"The cell is the basic unit of living organisms."],
["Photosynthesis takes place mainly in the",["mitochondrion","ribosome","chloroplast","vacuole"],2,"Chloroplasts contain chlorophyll and are the main site of photosynthesis."],
["Which blood component helps clotting?",["Red blood cells","Platelets","Plasma only","White blood cells"],1,"Platelets help form a clot at an injured blood vessel."],
["The hereditary unit is the",["gene","alveolus","nephron","enzyme"],0,"Genes are units of hereditary information."]
]},
{name:"Economics",icon:"📈",questions:[
["The basic economic problem arises because resources are",["unlimited","scarce relative to wants","always free","equally distributed"],1,"Scarcity means resources are limited compared with human wants."],
["Opportunity cost is the",["money spent on all goods","next best alternative forgone","total profit earned","cost of production only"],1,"Opportunity cost is the value of the next best option given up."],
["A rise in demand, other things equal, usually causes equilibrium price to",["fall","rise","remain zero","become negative"],1,"An increase in demand tends to raise equilibrium price if supply is unchanged."],
["Which institution is primarily responsible for monetary policy in Nigeria?",["Central Bank of Nigeria","Federal Road Safety Corps","Nigerian Ports Authority","INEC"],0,"The Central Bank of Nigeria is responsible for monetary policy."]
]},
{name:"Government",icon:"🏛️",questions:[
["The principle of separation of powers is associated with",["Montesquieu","Karl Marx","Adam Smith","Machiavelli only"],0,"Montesquieu is strongly associated with separation of legislative, executive and judicial powers."],
["A constitution is best described as",["a party manifesto","the fundamental rules for governing a state","a court judgment only","a campaign speech"],1,"A constitution establishes the structure and powers of government and citizens' rights."],
["The main function of the judiciary is to",["make budgets","interpret laws and administer justice","conduct elections","collect customs duties"],1,"Courts interpret and apply laws and resolve disputes."],
["In a democracy, political authority ultimately derives from",["hereditary rulers only","the people","the military alone","foreign companies"],1,"Democracy rests on popular sovereignty and citizen participation."]
]},
{name:"Literature in English",icon:"📚",questions:[
["The person who tells a story is the",["narrator","audience","publisher","critic"],0,"The narrator is the voice that relates the events of a narrative."],
["A comparison using “like” or “as” is a",["metaphor","simile","irony","pun"],1,"A simile makes an explicit comparison using like or as."],
["A play is primarily written to be",["measured","performed","catalogued","translated"],1,"Drama is written primarily for performance before an audience."],
["The central idea explored in a literary work is its",["theme","setting only","stage direction","rhyme scheme"],0,"Theme is a central idea or concern developed in a work."]
]},
{name:"CRS/IRS",icon:"🕊️",questions:[
["In the Bible, who led the Israelites out of Egypt?",["David","Moses","Solomon","Isaiah"],1,"Moses led the Israelites out of Egypt in the Exodus narrative."],
["In Islam, zakat is commonly understood as",["obligatory almsgiving","the pilgrimage","the call to prayer","fast-breaking meal"],0,"Zakat is obligatory almsgiving, one of the Five Pillars of Islam."],
["The Christian festival commemorating the resurrection of Jesus is",["Pentecost","Christmas","Easter","Epiphany"],2,"Easter commemorates the resurrection of Jesus."],
["The Qur'an is the holy book of",["Judaism","Islam","Christianity","Hinduism"],1,"The Qur'an is the central scripture of Islam."]
]}
];
const KEY="auraExamV2";
let db=loadDB(), user=db.currentUser||"", page="home", session=null, tick=null;
function loadDB(){try{return Object.assign({currentUser:"",users:{},results:[],codes:[],customQuestions:[],settings:{minutes:30},adminPin:"2468"},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return {currentUser:"",users:{},results:[],codes:[],customQuestions:[],settings:{minutes:30},adminPin:"2468"}}}
function save(){db.currentUser=user;localStorage.setItem(KEY,JSON.stringify(db));document.getElementById("userLabel").textContent=user?("Hi, "+user):""}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function allQs(sub){return [...(SUBJECTS.find(s=>s.name===sub)?.questions||[]).map((q,i)=>({subject:sub,topic:"Core practice",q:q[0],options:q[1],answer:q[2],explanation:q[3],source:"AURA practice sample"})),...db.customQuestions.filter(q=>q.subject===sub)]}
function go(p){page=p;render()}
function openModal(inner){document.getElementById("modalRoot").innerHTML=`<div class="modal" id="modal"><div class="modalbox">${inner}</div></div>`;document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function ensureUser(){if(user)return true;profileModal();return false}
function profileModal(){openModal(`<h2>Welcome to AURA</h2><p class="muted">Enter your name and an activation code to use the student area.</p><div class="field"><label>Your name / username</label><input id="loginName" placeholder="e.g. Ada" maxlength="40"></div><div class="field"><label>Activation code</label><input id="loginCode" placeholder="Enter code" autocapitalize="characters"></div><p class="notice">Demo access code: <b>AURA-START-2026</b>. This code is only for testing this local prototype.</p><div class="btnrow"><button class="btn gold" onclick="activate()">Continue</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function activate(){const n=document.getElementById("loginName").value.trim(),c=document.getElementById("loginCode").value.trim().toUpperCase();if(n.length<2)return alert("Enter a name with at least 2 characters.");const codeOk=c==="AURA-START-2026"||db.codes.some(x=>x.code===c&&(!x.usedBy||x.usedBy.toLowerCase()===n.toLowerCase()));if(!codeOk)return alert("That activation code is not valid or has already been used.");if(c!=="AURA-START-2026"){const row=db.codes.find(x=>x.code===c);row.usedBy=n;row.usedAt=new Date().toISOString()}user=n;db.users[n.toLowerCase()] ||= {name:n,joined:new Date().toISOString()};save();closeModal();render()}
function render(){save();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const app=document.getElementById("app");if(page==="home")app.innerHTML=home();else if(page==="practice")app.innerHTML=practice();else if(page==="results")app.innerHTML=results();else if(page==="leaderboard")app.innerHTML=leaderboard();else if(page==="admin")app.innerHTML=admin();else if(page==="exam")app.innerHTML=examUI();else if(page==="review")app.innerHTML=reviewUI();bindPage()}
function home(){const mine=db.results.filter(r=>r.user===user),avg=mine.length?Math.round(mine.reduce((a,r)=>a+r.percent,0)/mine.length):0;return `<section class="hero"><div><div class="badge">YOUR JAMB PREPARATION SPACE</div><h1>Study smarter with AURA.</h1><p>Practise by subject, sit timed mocks, review answers and track your progress.</p><div class="btnrow"><button class="btn gold" onclick="go('practice')">Start practising</button><button class="btn" onclick="profileModal()">${user?"Switch student":"Student sign in"}</button></div></div><div class="hero-mark">A</div></section><div class="stats"><div class="stat"><strong>${mine.length}</strong><span>Mocks completed</span></div><div class="stat"><strong>${avg}%</strong><span>Average score</span></div><div class="stat"><strong>${mine.reduce((a,r)=>a+r.correct,0)}</strong><span>Correct answers</span></div><div class="stat"><strong>${SUBJECTS.length}</strong><span>Subjects available</span></div></div><div class="section-head"><h2>Choose a subject</h2><span class="muted">9 subjects</span></div><div class="grid">${SUBJECTS.map(s=>`<button class="subject" onclick="startExam('${esc(s.name)}',false)"><span class="emoji">${s.icon}</span><b>${esc(s.name)}</b><small>${allQs(s.name).length} starter questions · Practice</small></button>`).join("")}</div><p class="footnote">This version contains original sample practice questions. It does not claim these are official JAMB past questions. Add properly sourced and verified past questions through the admin area.</p>`}
function practice(){return `<div class="section-head"><h2>Practice & mock exams</h2><span class="pill">Timed CBT</span></div><div class="card"><div class="field"><label>Subject</label><select id="subjectPick">${SUBJECTS.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Question count</label><select id="countPick"><option value="4">4 questions (quick demo)</option><option value="10">10 questions</option><option value="20">20 questions</option><option value="40">40 questions</option><option value="60">60 questions</option></select></div><div class="field"><label>Time limit (minutes)</label><select id="timePick"><option value="10">10 minutes</option><option value="20">20 minutes</option><option value="30" selected>30 minutes</option><option value="60">60 minutes</option><option value="120">120 minutes</option></select></div><div class="field"><label>Exam mode</label><select id="modePick"><option value="mock">Timed mock — answers shown after submission</option><option value="practice">Practice — explanation after each answer</option></select></div><button class="btn gold" onclick="beginFromForm()">Start exam</button></div><div class="section-head"><h2>Past-question library</h2></div><div class="card"><p>Past-question content can be added by the app owner after verifying its source and permission to use it. This starter build includes original practice questions only.</p><button class="btn ghost" onclick="go('admin')">Manage question bank</button></div>`}
function beginFromForm(){if(!ensureUser())return;const s=document.getElementById("subjectPick").value,n=+document.getElementById("countPick").value,m=+document.getElementById("timePick").value,mode=document.getElementById("modePick").value;startExam(s,mode==="mock",n,m,mode)}
function startExam(subject,timed=true,count=4,minutes=10,mode="mock"){if(!ensureUser())return;let pool=allQs(subject);if(!pool.length)return alert("No questions for this subject yet.");pool=pool.slice();for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const n=Math.min(count,pool.length);session={subject,questions:pool.slice(0,n),answers:{},index:0,seconds:minutes*60,mode,started:Date.now()};page="exam";render();if(tick)clearInterval(tick);tick=setInterval(()=>{if(!session||page!=="exam"){clearInterval(tick);return}session.seconds--;const t=document.getElementById("timer");if(t)t.textContent=fmt(session.seconds);if(session.seconds<=0)submitExam()},1000)}
function fmt(s){return Math.floor(s/60).toString().padStart(2,"0")+":"+Math.max(0,s%60).toString().padStart(2,"0")}
function examUI(){if(!session)return `<div class="card">No active exam. <button class="btn" onclick="go('practice')">Back</button></div>`;const q=session.questions[session.index],ans=session.answers[session.index],n=session.questions.length;return `<div class="section-head"><div><h2>${esc(session.subject)}</h2><span class="muted">${session.mode==="practice"?"Practice mode":"Timed mock exam"}</span></div><span class="pill" id="timer">${fmt(session.seconds)}</span></div><div class="progress"><span style="width:${(session.index+1)/n*100}%"></span></div><div class="question"><div class="qtop"><span>Question ${session.index+1} of ${n}</span><span>${Object.keys(session.answers).length} answered</span></div><div class="qtext">${esc(q.q)}</div>${q.options.map((o,i)=>`<label class="option ${ans===i?"selected":""}" onclick="chooseAnswer(${i})"><input type="radio" name="answer" ${ans===i?"checked":""}><span><b>${"ABCD"[i]}.</b> ${esc(o)}</span></label>`).join("")}${session.mode==="practice"&&ans!==undefined?`<div class="explain"><b>${ans===q.answer?"Correct!":"Review this answer"}</b><p>Correct answer: ${"ABCD"[q.answer]}. ${esc(q.options[q.answer])}</p>${esc(q.explanation||"Review the relevant topic.")}</div>`:""}<div class="btnrow"><button class="btn ghost" onclick="moveQ(-1)" ${session.index===0?"disabled":""}>Previous</button><button class="btn" onclick="moveQ(1)" ${session.index===n-1?"disabled":""}>Next</button><button class="btn gold" onclick="submitExam()">Submit exam</button></div></div><p class="footnote">Question source: ${esc(q.source||"AURA practice sample")}. Practice samples are not authenticated official past questions.</p>`}
function chooseAnswer(i){session.answers[session.index]=i;render();if(session.mode==="practice"){}}
function moveQ(d){session.index=Math.max(0,Math.min(session.questions.length-1,session.index+d));render()}
function submitExam(){if(!session)return;if(tick)clearInterval(tick);let correct=0;session.questions.forEach((q,i)=>{if(session.answers[i]===q.answer)correct++});const result={id:Date.now(),user,subject:session.subject,total:session.questions.length,correct,percent:Math.round(correct/session.questions.length*100),date:new Date().toISOString(),answers:session.answers,questions:session.questions};db.results.unshift(result);db.results=db.results.slice(0,500);save();session=null;page="review";window.lastResult=result;render()}
function reviewUI(){const r=window.lastResult;if(!r)return `<div class="card">No result to review. <button class="btn" onclick="go('results')">Results</button></div>`;return `<div class="hero"><div><div class="badge">EXAM COMPLETED</div><h1>${r.percent}%</h1><p>${r.correct} correct out of ${r.total} · ${esc(r.subject)}</p><div class="btnrow"><button class="btn gold" onclick="go('practice')">Try another mock</button><button class="btn" onclick="go('results')">All results</button></div></div><div class="hero-mark">${r.percent>=50?"✓":"↻"}</div></div><div class="section-head"><h2>Answer review</h2></div>${r.questions.map((q,i)=>`<div class="card" style="margin-bottom:10px"><b>${i+1}. ${esc(q.q)}</b><p class="${r.answers[i]===q.answer?"":"muted"}">Your answer: ${r.answers[i]===undefined?"Not answered":esc(q.options[r.answers[i]])}</p><p><b>Correct answer:</b> ${"ABCD"[q.answer]}. ${esc(q.options[q.answer])}</p><p class="muted">${esc(q.explanation||"Review the relevant topic.")}</p></div>`).join("")}`}
function results(){if(!ensureUser())return "";const rows=db.results.filter(r=>r.user===user);return `<div class="section-head"><h2>Your progress</h2><button class="btn ghost sm" onclick="exportMyResults()">Export CSV</button></div><div class="stats"><div class="stat"><strong>${rows.length}</strong><span>Mocks</span></div><div class="stat"><strong>${rows.length?Math.round(rows.reduce((a,r)=>a+r.percent,0)/rows.length):0}%</strong><span>Average</span></div><div class="stat"><strong>${rows.reduce((a,r)=>a+r.correct,0)}</strong><span>Correct</span></div><div class="stat"><strong>${new Set(rows.map(r=>r.subject)).size}</strong><span>Subjects tried</span></div></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Subject</th><th>Score</th><th>%</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${new Date(r.date).toLocaleDateString()}</td><td>${esc(r.subject)}</td><td>${r.correct}/${r.total}</td><td><b>${r.percent}%</b></td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty">You have not completed a mock exam yet. Start practising to build your progress history.</div>`}`}
function leaderboard(){const scores={};db.results.forEach(r=>{const k=r.user.toLowerCase();scores[k] ||= {name:r.user,total:0,n:0,best:0};scores[k].total+=r.percent;scores[k].n++;scores[k].best=Math.max(scores[k].best,r.percent)});const rows=Object.values(scores).sort((a,b)=>b.best-a.best||b.total/b.n-a.total/a.n);return `<div class="section-head"><h2>Leaderboard</h2><span class="pill">This device only</span></div><div class="notice">This demo leaderboard only includes results saved in this browser. A real public leaderboard needs a shared, secure database and anti-cheat protections.</div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Rank</th><th>Student</th><th>Mocks</th><th>Best score</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td>${i===0?"🏆":i+1}</td><td>${esc(r.name)}${user&&r.name.toLowerCase()===user.toLowerCase()?" (you)":""}</td><td>${r.n}</td><td><b>${r.best}%</b></td></tr>`).join(""):`<tr><td colspan="4">Complete a mock exam to appear here.</td></tr>`}</tbody></table></div>`}
function admin(){return `<div class="section-head"><h2>Admin dashboard</h2><span class="pill">Prototype</span></div><div class="notice">This admin screen is a local demo, not secure authentication. Do not use it to collect real payments or protect real exam content. Production needs server-side admin login, code validation and a database.</div><div class="card" style="margin-top:12px"><h3>Admin access</h3><div class="field"><label>Admin PIN</label><input id="adminPin" type="password" placeholder="Demo PIN"></div><button class="btn" onclick="unlockAdmin()">Unlock dashboard</button><p class="footnote">Demo PIN: 2468</p><div id="adminTools" class="hidden"><div class="stats"><div class="stat"><strong>${Object.keys(db.users).length}</strong><span>Student profiles on this device</span></div><div class="stat"><strong>${db.results.length}</strong><span>Mock results</span></div><div class="stat"><strong>${db.codes.length}</strong><span>Generated codes</span></div><div class="stat"><strong>${db.customQuestions.length}</strong><span>Custom questions</span></div></div><div class="section-head"><h2>Generate activation codes</h2></div><div class="field"><label>Number of codes</label><select id="codeCount"><option>1</option><option>5</option><option>10</option><option>25</option></select></div><button class="btn gold" onclick="generateCodes()">Generate codes</button><div id="codeList"></div><div class="section-head"><h2>Add a question</h2></div><div class="field"><label>Subject</label><select id="customSubject">${SUBJECTS.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Question text</label><textarea id="customQ" placeholder="Type your question"></textarea></div><div class="field"><label>Option A</label><input id="opt0"></div><div class="field"><label>Option B</label><input id="opt1"></div><div class="field"><label>Option C</label><input id="opt2"></div><div class="field"><label>Option D</label><input id="opt3"></div><div class="field"><label>Correct answer</label><select id="correctOpt"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Explanation / solution</label><textarea id="customExplain"></textarea></div><div class="field"><label>Source / attribution (if applicable)</label><input id="customSource" placeholder="e.g. author, year, permission/source notes"></div><button class="btn green" onclick="addCustomQuestion()">Save question</button><div class="section-head"><h2>Recent results</h2></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Subject</th><th>Score</th><th>Date</th></tr></thead><tbody>${db.results.slice(0,30).map(r=>`<tr><td>${esc(r.user)}</td><td>${esc(r.subject)}</td><td>${r.percent}%</td><td>${new Date(r.date).toLocaleDateString()}</td></tr>`).join("")||"<tr><td colspan='4'>No results yet.</td></tr>"}</tbody></table></div></div></div>`}
function unlockAdmin(){if(document.getElementById("adminPin").value!==db.adminPin)return alert("Incorrect PIN.");document.getElementById("adminTools").classList.remove("hidden");renderCodeList()}
function generateCodes(){const n=+document.getElementById("codeCount").value;for(let i=0;i<n;i++){const code="AURA-"+Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();db.codes.push({code,createdAt:new Date().toISOString(),usedBy:""});}save();renderCodeList();alert("Demo codes generated on this device. These are not secure paid activation codes.");}
function renderCodeList(){const el=document.getElementById("codeList");if(el)el.innerHTML=`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Code</th><th>Status</th></tr></thead><tbody>${db.codes.slice().reverse().map(c=>`<tr><td>${esc(c.code)}</td><td>${c.usedBy?"Used by "+esc(c.usedBy):"Unused"}</td></tr>`).join("")||"<tr><td colspan='2'>No codes generated.</td></tr>"}</tbody></table></div><button class="btn ghost sm" onclick="copyCodes()">Copy unused codes</button>`}
function copyCodes(){const s=db.codes.filter(c=>!c.usedBy).map(c=>c.code).join("\n");navigator.clipboard?.writeText(s).then(()=>alert("Copied unused codes.")).catch(()=>alert(s||"No unused codes."))}
function addCustomQuestion(){const subject=document.getElementById("customSubject").value,q=document.getElementById("customQ").value.trim(),options=[0,1,2,3].map(i=>document.getElementById("opt"+i).value.trim()),answer=+document.getElementById("correctOpt").value,explanation=document.getElementById("customExplain").value.trim(),source=document.getElementById("customSource").value.trim();if(!q||options.some(x=>!x))return alert("Fill in the question and all four options.");db.customQuestions.push({subject,q,options,answer,explanation,source:source||"Admin-added practice question"});save();alert("Question saved on this device.");render()}
function exportMyResults(){const rows=db.results.filter(r=>r.user===user),csv="date,student,subject,correct,total,percent\n"+rows.map(r=>[r.date,r.user,r.subject,r.correct,r.total,r.percent].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");download("aura-results.csv",csv,"text/csv")}
function download(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function bindPage(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)go(b.dataset.page)});
document.getElementById("profileBtn").onclick=profileModal;
window.addEventListener("beforeunload",()=>{if(tick)clearInterval(tick)});
save();render();
</script>
</body></html>
